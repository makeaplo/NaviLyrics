name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Check whitespace
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD

      - name: Run unit tests
        run: |
          xcodebuild \
            -project NaviLyrics.xcodeproj \
            -scheme NaviLyrics \
            -configuration Debug \
            -destination 'platform=iOS Simulator,OS=26.5,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/NaviLyricsTests" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build Release
        run: |
          xcodebuild \
            -project NaviLyrics.xcodeproj \
            -scheme NaviLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NaviLyricsRelease" \
            CODE_SIGNING_ALLOWED=NO \
            build
